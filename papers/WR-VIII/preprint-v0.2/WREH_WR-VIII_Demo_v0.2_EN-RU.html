:root{color-scheme:light;--ink:#183c55;--muted:#526f83;--blue:#166a8c;--amber:#b86813;--purple:#773f8c;--line:#c8d9e4}*{box-sizing:border-box}body{margin:0;background:#f4f8fb;color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1220px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;gap:20px;align-items:start;padding-bottom:26px;border-bottom:1px solid var(--line)}h1{font-size:clamp(27px,4vw,44px);line-height:1.12;max-width:900px;margin:12px 0}h2{font-size:22px;line-height:1.25;margin:0 0 18px}h3{font-size:18px;margin:20px 0 8px}p{margin:10px 0}.eyebrow{font-size:13px;font-weight:750;letter-spacing:1px;color:var(--blue)}.lead,.muted{color:var(--muted)}button,select,input{font:inherit;color:var(--ink)}button{background:white;border:1px solid var(--line);border-radius:7px;padding:9px 13px;cursor:pointer}button:hover{border-color:var(--blue)}.layout{display:grid;grid-template-columns:310px 1fr;gap:24px;margin-top:24px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:24px;min-width:0}.control{margin:18px 0}.label{display:flex;gap:10px;justify-content:space-between;font-size:14px;color:var(--muted)}.label output{font-weight:700}input[type=range]{width:100%;margin-top:8px;accent-color:var(--blue)}input[type=number],select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:white;margin-top:7px}.buttons{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}.buttons button{padding:6px 9px;font-size:13px}.result{background:#edf4f8;padding:15px;border-radius:8px;margin:12px 0;font-size:15px;overflow-wrap:anywhere}.formula{font-family:Georgia,serif;font-size:20px;line-height:1.5}.charts{display:grid;grid-template-columns:1fr 1fr;gap:15px}svg{display:block;width:100%;height:auto}.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:6px}.legend span:before{content:"";display:inline-block;width:17px;height:3px;background:var(--c);vertical-al </style></head><body><main><header><div><div class="eyebrow">WREH · WR-VIII v0.2</div><h1 data-t="title"></h1><p class="lead" data-t="subtitle"></p></div><button id="lang" type="button">English</button></header>
<div class="layout"><section class="card"><h2 data-t="controls"></h2><div class="control"><label class="label" for="h0"><span data-t="scale"></span><output id="h0v"></output></label><input id="h0" type="range" min="50" max="100" step="1" value="70"></div><div class="control"><label class="label" for="shape"><span data-t="shape"></span><output id="shapev"></output></label><input id="shape" type="range" min="-.25" max=".2" step=".01" value="-.15"></div><div class="control"><label class="label" for="q"><span data-t="curvature"></span><output id="qv"></output></label><input id="q" type="range" min="-.4" max=".4" step=".01" value="0"></div><div class="control"><label class="label" for="mode" data-t="protocol"></label><select id="mode"><option value="distance" data-t="distanceOnly"></option><option value="exact" data-t="exact"></option><option value="interval" data-t="interval"></option><option value="conflict" data-t="conflict"></option></select></div><div class="control"><label class="label" for="probe" data-t="probe"></label><input id="probe" type="number" min="20" max="250" step="1" value="100"></div><div class="control"><label class="label" for="error"><span data-t="error"></span><output id="errorv"></output></label><input id="error" type="range" min="0" max="10" step=".5" value="2"></div><div class="buttons"><button id="reset" data-t="reset"></button><button id="flat" data-t="flatButton"></button><button id="band" data-t="bandButton"></button><button id="empty" data-t="emptyButton"></button></div><p class="small muted" data-t="prior"></p></section>

<script>
'use strict';const words={en:{title:'The Cosmological Fibre',subtitle:'One distance profile, different curvatures and expansion histories. A synthetic FLRW completion model.',controls:'Background and protocols',scale:'Synthetic H₀ (km/s/Mpc)',shape:'Distance shape a = v/u',curvature:'Candidate curvature q = κu²',protocol:'Additional rate responses',distanceOnly:'Distance profile only',exact:'Exact H(1)',interval:'H(1) interval',conflict:'Two conflicting rate intervals',probe:'Synthetic independent H(1) (km/s/Mpc)',error:'Rate tolerance ± (km/s/Mpc)',reset:'Distance only',flatButton:'Exact flat rate',bandButton:'Rate interval',emptyButton:'Conflicting rates',prior:'Displayed prior q ∈ [−0.4, 0.4] is a supplied restriction, not inferred from distances. Z = 1.5. All numbers are synthetic.',independent:'H(1) is a separate synthetic input. Its value is held fixed when the distance scale or shape is changed. These intervals have no assigned confidence probability.',curveScope:'The three curves match the distance profile. Additional rate constraints are displayed separately below.',distanceChart:'Identical distances',rateChart:'Different expansion rates',refinement:'Compatible curvature in the displayed prior',global:'A background is not a global spatial lift',globalIntro:'For a flat compatible member, Euclidean space and a cubic torus share the supplied classical observed patch when L > 2R, with R = D(1.5). The diagram is a two-dimensional cross-section of a three-dimensional construction.',side:'Torus side L/u',topologyNote:'The witness assumes copied local metric and classical source fields. The quotient preserves the local metric tensor; global shortest paths may leave the patch. Global spectra, quantum states and perturbation priors require their own response models. Failure of L > 2R does not prove detectability.',record:'Model and claim boundary',recordText:'A positive FLRW kinematic background on a finite redshift interval; first increasing transverse-distance branch; calibrated absolute distance profile and derivative; optional independent positive rate responses. κ has units Mpc⁻², D has units Mpc, and H has units km/s/Mpc. A matter equation of state is not supplied.',channels:'The paper defines ideal supernova and BAO background interfaces, including their scale ambiguity. CMB spectra, lensing and growth engines, survey catalogues, covariances and actual cosmological fits remain separate work packages.',ceiling:'An empty class rejects the supplied model/data/calibration combination. A selected background does not identify global topology or a future without a supplied dynamics law. Finite current protocols do not establish equivalence for all future observers.',footer:'Preprint v0.2 · Automated audit incorporated · No WR-VIII DOI · External peer review not established',nonempty:'Compatible backgrounds remain',singleton:'One background in this declared family',emptyStatus:'No background fits the supplied responses',intervalLabel:'Compatible set',cap:'Open branch cap',candidateOk:'Selected candidate lies in the compatible set.',candidateNo:'Selected candidate is outside the compatible set.',invalid:'Selected candidate violates the positive first-branch carrier.',flatAbsent:'The flat member is absent from this compatible set. The topology witness is not a lift of the current response class.',witness:'The sufficient topology witness applies.',noWitness:'The sufficient witness condition fails; no detectability conclusion follows.',axisZ:'Redshift z'},ru:{title:'Космологический слой',subtitle:'Один профиль расстояний, разные кривизны и истории расширения. Синтетическая модель достраивания FLRW.',controls:'Фон и протоколы',scale:'Синтетическая H₀ (км/с/Мпк)',shape:'Форма расстояний a = v/u',curvature:'Кривизна кандидата q = κu²',protocol:'Дополнительные отклики скоростей',distanceOnly:'Только профиль расстояний',exact:'Точная H(1)',interval:'Интервал H(1)',conflict:'Два несовместимых интервала скоростей',probe:'Синтетическая независимая H(1) (км/с/Мпк)',error:'Допуск скорости ± (км/с/Мпк)',reset:'Только расстояния',flatButton:'Точная плоская скорость',bandButton:'Интервал скорости',emptyButton:'Несовместимые скорости',prior:'Показанное ограничение q ∈ [−0.4, 0.4] задано извне, а не выведено из расстояний. Z = 1.5. Все числа синтетические.',independent:'H(1) — отдельный синтетический вход. Его значение сохраняется при изменении масштаба или формы расстояний. Доверительная вероятность этим интервалам не присвоена.',curveScope:'Три кривые согласуют профиль расстояний. Дополнительные ограничения скоростей показаны отдельно ниже.',distanceChart:'Одинаковые расстояния',rateChart:'Разные скорости расширения',refinement:'Совместимая кривизна в показанном ограничении',global:'Фон ещё не задаёт глобальное пространственное поднятие',globalIntro:'Для совместимого плоского элемента евклидово пространство и кубический тор совпадают на заданном классическом наблюдаемом участке при L > 2R, где R = D(1.5). Рисунок — двумерное сечение трёхмерной конструкции.',side:'Сторона тора L/u',topologyNote:'Свидетель предполагает скопированные локальную метрику и классические поля источников. Факторизация сохраняет локальный метрический тензор; глобальные кратчайшие пути могут выходить за участок. Глобальным спектрам, квантовым состояниям и моделям возмущений нужны свои отображения откликов. Нарушение L > 2R не доказывает обнаружимость.',record:'Модель и предел утверждений',recordText:'Положительный кинематический фон FLRW на конечном интервале красных смещений; первая возрастающая ветвь поперечных расстояний; калиброванные абсолютный профиль и производная; дополнительные независимые положительные скорости. κ имеет единицы Мпк⁻², D — Мпк, H — км/с/Мпк. Уравнение состояния материи не задано.',channels:'Статья задаёт идеальные фоновые интерфейсы сверхновых и BAO, включая неоднозначность масштаба. Расчёты спектров CMB, линзирования и роста, каталоги обзоров, ковариации и реальная космологическая подгонка остаются отдельными пакетами работ.',ceiling:'Пустой класс отвергает заданную комбинацию модели, данных и калибровки. Выбранный фон не идентифицирует глобальную топологию или будущее без заданного закона динамики. Конечные нынешние протоколы не устанавливают эквивалентность для всех будущих наблюдателей.',footer:'Препринт v0.2 · Замечания автоматизированного аудита учтены · DOI WR-VIII пока нет · Внешнее рецензирование не установлено',nonempty:'Совместимые фоны сохраняются',singleton:'Один фон в этом заданном семействе',emptyStatus:'Ни один фон не согласует заданные отклики',intervalLabel:'Совместимое множество',cap:'Открытая граница ветви',candidateOk:'Выбранный кандидат принадлежит совместимому множеству.',candidateNo:'Выбранный кандидат вне совместимого множества.',invalid:'Выбранный кандидат нарушает положительность первой ветви.',flatAbsent:'Плоского элемента нет в совместимом множестве. Топологический свидетель не является поднятием текущего класса откликов.',witness:'Достаточный топологический свидетель применим.',noWitness:'Достаточное условие свидетеля нарушено; вывода об обнаружимости нет.',axisZ:'Красное смещение z'}};
let language='ru';const $=id=>document.getElementById(id),num=id=>Number($(id).value),fmt=(x,n=5)=>Number.isFinite(x)?x.toFixed(n).replace(/\.0+$|(?<=\.[0-9]*?)0+$/g,''):String(x);const C=299792.458,Z=1.5;
function chart(id,curves,ylabel,max){const w=430,h=285,l=58,r=12,t=14,b=49;let s=`<rect x="0" y="0" width="430" height="285" fill="white"/>`;for(let i=0;i<=4;i++){let y=h-b-(h-b-t)*i/4;s+=`<line x1="${l}" x2="${w-r}" y1="${y}" y2="${y}" stroke="#e5edf2"/><text x="${l-8}" y="${y+4}" text-anchor="end" fill="#526f83" font-size="11">${fmt(max*i/4,0)}</text>`;}for(let z=0;z<=Z;z+=.5){let x=l+(w-r-l)*z/Z;s+=`<text x="${x}" y="${h-b+22}" text-anchor="middle" fill="#526f83" font-size="11">${fmt(z,1)}</text>`;}s+=`<line x1="${l}" x2="${l}" y1="${t}" y2="${h-b}" stroke="#9ab3c4"/><line x1="${l}" x2="${w-r}" y1="${h-b}" y2="${h-b}" stroke="#9ab3c4"/>`;for(const line of curves){let pts=[];for(let i=0;i<=150;i++){let z=Z*i/150,y=line.fn(z);if(Number.isFinite(y))pts.push(`${i?'L':'M'}${(l+(w-r-l)*z/Z).toFixed(3)},${(h-b-(h-b-t)*y/max).toFixed(3)}`);}s+=`<path d="${pts.join(' ')}" stroke="${line.color}" fill="none" stroke-width="2.1" ${line.dash?`stroke-dasharray="${line.dash}"`:''}/>`;}s+=`<text x="${(l+w-r)/2}" y="${h-5}" text-anchor="middle" fill="#526f83" font-size="12">${words[language].axisZ}</text><text x="13" y="${(t+h-b)/2}" transform="rotate(-90 13 ${(t+h-b)/2})" text-anchor="middle" fill="#526f83" font-size="11">${ylabel}</text>`;$(id).innerHTML=s;}
function update(){const t=words[language];document.documentElement.lang=language;for(const e of document.querySelectorAll('[data-t]'))e.textContent=t[e.dataset.t];$('lang').textContent=language==='ru'?'English':'Русский';const h0=num('h0'),a=num('shape'),q=num('q'),h=num('probe'),eps=num('error'),side=num('side'),mode=$('mode').value,u=C/h0,f=z=>z+a*z*z,g=z=>1+2*a*z,cap=1/f(Z)**2;let lo=-.4,hi=Math.min(.4,cap),upperOpen=cap<=.4;
const inverse=(z,hp)=> (1-(hp*g(z)/h0)**2)/f(z)**2;
const intersect=(l,r)=>{lo=Math.max(lo,l);hi=Math.min(hi,r);};
if(mode==='exact'){let k=inverse(1,h);intersect(k,k);}if(mode==='interval'||mode==='conflict'){intersect(inverse(1,h+eps),inverse(1,Math.max(.001,h-eps)));}if(mode==='conflict'){intersect(inverse(.5,100+eps),inverse(.5,100-eps));}
const nonempty=Number.isFinite(h)&&h>0&&(lo<hi||(Math.abs(lo-hi)<1e-12&&lo<cap));const singleton=nonempty&&Math.abs(lo-hi)<1e-12;const branch=q<cap;const member=nonempty&&q>=lo-1e-12&&q<=hi+1e-12&&branch;const flatAllowed=nonempty&&lo<=1e-12&&hi>=-1e-12;const topologySufficient=flatAllowed&&side>2*f(Z);
$('h0v').textContent=h0;$('shapev').textContent=fmt(a,2);$('qv').textContent=fmt(q,2);$('errorv').textContent=fmt(eps,1);$('sidev').textContent=fmt(side,2);$('passport').textContent=`u = ${fmt(u,3)} Mpc · Z = 1.5 · q < ${fmt(cap,6)}`;
$('status').textContent=nonempty?(singleton?t.singleton:t.nonempty):t.emptyStatus;$('status').className=nonempty?'good':'bad';$('compatible').textContent=`${t.intervalLabel}: ${nonempty?(singleton?`{${fmt(lo,7)}}`:`[${fmt(lo,7)}, ${fmt(hi,7)}${upperOpen&&Math.abs(hi-cap)<1e-12?')':']'}`):'∅'}`;
$('candidate').textContent=branch?(member?t.candidateOk:t.candidateNo):t.invalid;$('candidate').className='small '+(member?'good':'bad');chart('distancePlot',[{fn:z=>u*f(z),color:'#b86813',dash:'6 4'},{fn:z=>u*f(z),color:'#166a8c'},{fn:z=>u*f(z),color:'#773f8c',dash:'2 4'}],'D (Mpc)',u*f(Z)*1.1);const curves=[-.2,0,.2].map((k,i)=>({fn:z=>h0*Math.sqrt(1-k*f(z)**2)/g(z),color:['#b86813','#166a8c','#773f8c'][i],dash:['6 4','','2 4'][i]}));chart('ratePlot',curves,'H (km/s/Mpc)',Math.max(...curves.map(x=>x.fn(Z)))*1.13);
let fs='<rect x="0" y="0" width="800" height="125" fill="white"/><line x1="45" x2="755" y1="45" y2="45" stroke="#c8d5df" stroke-width="13"/>';const xp=x=>45+710*(x+.4)/.8;if(nonempty){if(singleton)fs+=`<circle cx="${xp(lo)}" cy="45" r="7" fill="#b86813"/>`;else fs+=`<line x1="${xp(lo)}" x2="${xp(hi)}" y1="45" y2="45" stroke="#166a8c" stroke-width="13"/>`;}else fs+='<text x="400" y="30" text-anchor="middle" fill="#9b352f" font-size="22">∅</text>';for(let v=-.4;v<=.40001;v+=.2)fs+=`<text x="${xp(v)}" y="80" text-anchor="middle" fill="#526f83" font-size="17">${fmt(v,1)}</text>`;fs+='<text x="400" y="114" text-anchor="middle" fill="#526f83" font-size="18">q = κu²</text>';$('fibrePlot').innerHTML=fs;
$('topology').textContent=(flatAllowed?(topologySufficient?t.witness:t.noWitness):t.flatAbsent)+` R/u = ${fmt(f(Z),4)}, L/u = ${fmt(side,2)}.`;const scale=220/Math.max(side,2*f(Z)+.15),s=side*scale,rr=f(Z)*scale;$('torusPlot').innerHTML=`<rect x="${140-s/2}" y="${140-s/2}" width="${s}" height="${s}" fill="#f3f7fa" stroke="#166a8c" stroke-width="2"/><circle cx="140" cy="140" r="${rr}" fill="#b86813" fill-opacity=".15" stroke="#b86813"/><circle cx="140" cy="140" r="3" fill="#183c55"/><line x1="140" x2="${140+rr}" y1="140" y2="140" stroke="#b86813"/><text x="${140+rr/2}" y="132" text-anchor="middle" fill="#526f83" font-size="14">R</text><text x="140" y="268" text-anchor="middle" fill="#526f83" font-size="14">L = ${fmt(side,2)}u</text>`;
window.demoState={h0,a,q,u,Z,cap,mode,probe:h,error:eps,lo,hi,nonempty,singleton,branch,member,flatAllowed,side,R:f(Z),topologySufficient};}
for(const e of document.querySelectorAll('input,select'))e.addEventListener('input',update);$('lang').addEventListener('click',()=>{language=language==='ru'?'en':'ru';update();});function preset(mode){$('h0').value=70;$('shape').value=-.15;$('q').value=0;$('probe').value=100;$('error').value=2;$('side').value=3.5;$('mode').value=mode;update();}for(const [id,mode]of[['reset','distance'],['flat','exact'],['band','interval'],['empty','conflict']])$(id).addEventListener('click',()=>preset(mode));update();
</script></body></html>
