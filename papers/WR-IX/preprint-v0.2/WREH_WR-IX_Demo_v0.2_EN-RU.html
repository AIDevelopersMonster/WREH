<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR-IX · Epistemic Horizons</title>
<style>
:root{--ink:#17334a;--muted:#587080;--paper:#f4f3ed;--line:#d9e0df;--accent:#b35b36}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}header{background:var(--ink);color:#fff;padding:24px max(24px,calc((100vw - 1100px)/2));display:flex;justify-content:space-between;gap:20px;align-items:center}header strong{letter-spacing:.12em;font-size:14px}button{font:inherit;border:1px solid #8ca0ae;border-radius:5px;background:transparent;color:inherit;padding:6px 16px;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #b35b36;outline-offset:4px}main{max-width:1100px;margin:auto;padding:38px 24px 60px}.eyebrow{color:var(--accent);font-size:13px;text-transform:uppercase;letter-spacing:.13em}h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(34px,5vw,59px);line-height:1.08;max-width:850px;margin:12px 0 20px}h2{font:400 27px/1.2 Georgia,serif;margin:0 0 18px}p{margin:0 0 18px}.intro{max-width:830px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:24px;margin-top:30px}.card{background:white;border:1px solid var(--line);border-radius:9px;padding:24px;min-width:0}label{display:block;font-size:14px;margin-top:19px}input[type=range]{display:block;width:100%;margin:10px 0 22px;accent-color:var(--ink)}output{float:right;font-variant-numeric:tabular-nums;color:var(--accent)}.verdict{font:400 26px/1.25 Georgia,serif;margin-bottom:10px}.formula{padding:15px;background:#eff3f5;font-family:Georgia,serif;font-size:19px;margin:16px 0;overflow-wrap:anywhere}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.metric{border-top:1px solid var(--line);padding-top:12px}.metric small{display:block;color:var(--muted)}.metric b{font:400 25px/1.4 Georgia,serif}svg{width:100%;height:auto;display:block;margin-top:12px}.legend{color:var(--muted);font-size:13px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pair div{background:#eff3f5;padding:18px;border-radius:5px}.pair b{display:block;color:var(--accent);font-size:19px;margin-bottom:8px}.note{font-size:14px;color:var(--muted)}.wide{margin-top:24px}footer{margin-top:30px;border-top:1px solid var(--line);padding-top:20px;color:var(--muted);font-size:13px}a{color:inherit}@media(max-width:700px){main{padding:30px 18px}.grid,.pair{grid-template-columns:1fr}.card{padding:20px}header{padding:18px}.metrics{gap:6px}h1{font-size:38px}}
</style></head><body>
<header><strong>WREH / WR-IX</strong><button id="language" aria-label="Switch language">English</button></header>
<main><div class="eyebrow" data-key="eyebrow"></div><h1 data-key="title"></h1><p class="intro" data-key="intro"></p>
<div class="grid"><section class="card"><h2 data-key="controls"></h2>
<label for="period"><span data-key="period"></span><output id="period-value"></output></label><input id="period" type="range" min="0.01" max="1.25" step="0.01" value="0.5">
<label for="deadline"><span data-key="deadline"></span><output id="deadline-value"></output></label><input id="deadline" type="range" min="0" max="8" step="0.01" value="1">
<label for="energy"><span data-key="energy"></span><output id="energy-value"></output></label><input id="energy" type="range" min="0" max="50" step="0.1" value="3">
<p class="note" data-key="units"></p><div class="formula">a(t) = e<sup>Ht</sup><br>HT<sub>L</sub> = −log(1 − x)<br>E<sub>req</sub>/E<sub>d</sub> = 1/(1 − x)</div>
</section><section class="card" aria-live="polite"><div class="eyebrow" data-key="result"></div><p class="verdict" id="verdict"></p><p id="reason"></p><div class="metrics"><div class="metric"><small data-key="arrival"></small><b id="arrival"></b></div><div class="metric"><small data-key="need"></small><b id="need"></b></div></div>
<svg id="plot" viewBox="0 0 420 235" role="img" aria-labelledby="plot-title"><title id="plot-title"></title><path d="M40 18 V194 H402" fill="none" stroke="#a3b1ba"/><path id="reach-path" fill="none" stroke="#17334a" stroke-width="2.5"/><path id="level-path" fill="none" stroke="#b35b36" stroke-dasharray="5 4"/><circle id="marker" r="5" fill="#b35b36"/><text x="44" y="15" font-size="12" fill="#587080">HS/c</text><text x="357" y="223" font-size="12" fill="#587080">Ht</text><text x="38" y="210" font-size="11">0</text><text x="390" y="210" font-size="11">8</text><text id="period-label" x="48" y="32" font-size="12" fill="#b35b36"></text></svg>
<p class="legend" data-key="legend"></p><p class="note" data-key="boundary"></p>
</section></div>
<section class="card wide"><h2 data-key="future-title"></h2><p data-key="future-intro"></p><div class="pair"><div><b data-key="future-plus"></b><span data-key="future-plus-text"></span></div><div><b data-key="future-minus"></b><span data-key="future-minus-text"></span></div></div><p class="note" style="margin-top:18px" data-key="tail-note"></p></section>
<section class="card wide"><h2 data-key="scope-title"></h2><p data-key="scope"></p><p class="note" data-key="audit"></p></section>
<footer><span data-key="footer"></span> · <a href="https://github.com/AIDevelopersMonster/WREH">A. A. Malachevsky · WREH</a> · v0.2 · CC BY 4.0 / MIT</footer>
</main><script>
const strings={ru:{eyebrow:'Последняя техническая статья первого цикла',title:'Что наблюдатель внутри мира может различить?',intro:'Нехватка ресурсов сегодня и отсутствие любого будущего различающего отклика — разные утверждения. Здесь проверяется один объявленный протокол: первое возвращение меченого светового импульса в расширяющемся кубическом торе.',controls:'Ресурсы наблюдателя',period:'Период тора · x = HL/c',deadline:'Срок ожидания · Hτ',energy:'Энергия запуска · Emax/Ed',units:'Все регуляторы безразмерны. H имеет единицы 1/с; L и c/H — длины; Emax и Ed — энергии в джоулях. Это синтетический пример.',result:'Сертификат этого протокола',arrival:'Время первого возвращения · HTL',need:'Требуемая энергия · Ereq/Ed',legend:'Синяя линия: нормированный сопутствующий путь HS(t)/c. Пунктир: период тора. Точка: выбранный срок ожидания.',boundary:'Причинная граница x = 1 исключена. Равенство конечному сроку и порогу детектора включено. В евклидовом накрытии этот импульс не возвращается.',detected:'Возвращение обнаружимо',detectedReason:'Времени и энергии достаточно при объявленных идеальных условиях.',time:'Пока не вернулся',timeReason:'Конечное возвращение существует, но выбранный срок слишком мал.',both:'Не хватает времени и энергии',bothReason:'Возвращение возможно в принципе в этой истории, но оба текущих ограничения мешают обнаружению.',energyFail:'Энергии недостаточно',energyReason:'Луч может вернуться, но энергия на детекторе ниже заданного порога.',causal:'Нет конечного возвращения',causalReason:'Период не меньше всего оставшегося пути света в данной экспоненциальной истории. Этот вывод относится к объявленному протоколу.',futureTitle:'Одно прошлое — разная будущая доступность','future-title':'Одно прошлое — разная будущая доступность','future-intro':'При H = c = 1 две гладкие истории совпадают при всех t ≤ 1, включая всё прошлое. После гладкого перехода до t = 1.5 их хвосты расходятся. Возьмём период L = 1.2.','future-plus':'Экспоненциальный хвост','future-plus-text':'S∞ = 1. Для L = 1.2 конечного возвращения нет.','future-minus':'Гладкий линейный хвост','future-minus-text':'S∞ = ∞. Возвращение при t ≈ 4.87448; идеальная пороговая энергия ≈ 13.64037 Ed.','tail-note':'Некомпактный хвост построен в теореме 6.1. Расходимость устанавливает доказательство, а не конечное численное моделирование. Одна фиксированная теория материи не задана.','scope-title':'Область утверждения',scope:'Ориентация решётки известна. Лаборатория сопутствующая. Потерь, рассеяния и ложных откликов нет; весь пакет собирается. Необнаружение импульса не доказывает неразличимость всех полей, квантовых состояний или иных экспериментов. Математическая совместимость не удостоверяет физическую реалистичность.',audit:'PUBLICATION_READY · Подготовлено с помощью ИИ; автоматические проверки не являются независимым внешним научным рецензированием. DOI WR-IX пока нет.',footer:'Автономная демонстрация; интернет для вычислений не нужен.'},en:{eyebrow:'Final technical article of the first cycle',title:'What can an observer inside a world distinguish?',intro:'Insufficient resources today and the absence of any future separating response are different claims. This demo checks one declared protocol: the first return of a tagged light pulse in an expanding cubic torus.',controls:'Observer resources',period:'Torus period · x = HL/c',deadline:'Waiting deadline · Hτ',energy:'Launch energy · Emax/Ed',units:'All controls are dimensionless. H is in 1/s; L and c/H are lengths; Emax and Ed are energies in joules. This is a synthetic benchmark.',result:'Certificate for this protocol',arrival:'First-return time · HTL',need:'Required energy · Ereq/Ed',legend:'Blue: normalized comoving light path HS(t)/c. Dashed: torus period. Dot: selected waiting deadline.',boundary:'The causal endpoint x = 1 is excluded. Finite-deadline and detector equalities are included. This pulse never returns in the Euclidean cover.',detected:'Return is detectable',detectedReason:'Time and launch energy suffice under the declared ideal conditions.',time:'No return yet',timeReason:'A finite return exists, but the selected deadline is too short.',both:'Time and energy are insufficient',bothReason:'A return is possible in this history, but both present constraints prevent detection.',energyFail:'Insufficient energy',energyReason:'The ray can return, but its detector energy is below the stated threshold.',causal:'No finite return',causalReason:'The period is at least the entire remaining light-travel span in this exponential history. This conclusion is protocol-relative.','future-title':'One past — different future access','future-intro':'For H = c = 1, two smooth histories agree for all t ≤ 1, including the entire past. After a smooth transition ending at t = 1.5, their tails differ. Choose period L = 1.2.','future-plus':'Exponential tail','future-plus-text':'S∞ = 1. No finite return exists for L = 1.2.','future-minus':'Smooth linear tail','future-minus-text':'S∞ = ∞. Return at t ≈ 4.87448; ideal threshold energy ≈ 13.64037 Ed.','tail-note':'The noncompact tail is constructed in Theorem 6.1. Divergence is established by the proof, not by finite numerical simulation. No single fixed matter theory is supplied.','scope-title':'Scope of the claim',scope:'The lattice orientation is known. The laboratory is comoving. There are no losses, scattering or false responses; the entire packet is collected. Failure to detect the pulse does not prove equality of all fields, quantum states or other experiments. Mathematical compatibility does not certify physical realism.',audit:'PUBLICATION_READY · AI-assisted preparation; automated checks are not independent external scientific peer review. No WR-IX DOI yet.',footer:'Offline demonstration; computation needs no network.'}};
let lang='ru';
function compute(x,u,e){if(!(x>0)||!Number.isFinite(x)||!(u>=0)||!(e>=0))throw Error('invalid domain');let time=x<1?-Math.log1p(-x):Infinity,need=x<1?1/(1-x):Infinity;let kind=x>=1?'causal':u<time?(e<need?'both':'time'):(e<need?'energyFail':'detected');return {time,need,kind,limit:e>=1?Math.min(-Math.expm1(-u),1-1/e):0};}
function render(){const s=strings[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-key]').forEach(el=>{el.textContent=s[el.dataset.key]});document.getElementById('language').textContent=lang==='ru'?'English':'Русский';const x=+document.getElementById('period').value,u=+document.getElementById('deadline').value,e=+document.getElementById('energy').value,r=compute(x,u,e);['period','deadline','energy'].forEach((id,i)=>document.getElementById(id+'-value').value=[x,u,e][i].toFixed(i===2?1:2));document.getElementById('verdict').textContent=s[r.kind];document.getElementById('reason').textContent=s[r.kind==='energyFail'?'energyReason':r.kind+'Reason'];document.getElementById('arrival').textContent=Number.isFinite(r.time)?r.time.toFixed(4):'∞';document.getElementById('need').textContent=Number.isFinite(r.need)?r.need.toFixed(4):'∞';let path='';for(let j=0;j<=160;j++){let t=j/20;path+=(j?'L':'M')+(40+45*t).toFixed(2)+' '+(194-140*(-Math.expm1(-t))).toFixed(2)+' ';}document.getElementById('reach-path').setAttribute('d',path);document.getElementById('level-path').setAttribute('d',`M40 ${194-140*x} H400`);document.getElementById('marker').setAttribute('cx',40+45*u);document.getElementById('marker').setAttribute('cy',194-140*(-Math.expm1(-u)));document.getElementById('period-label').textContent='x = '+x.toFixed(2);document.getElementById('plot-title').textContent=lang==='ru'?'Путь света и период тора':'Light-travel span and torus period';}
document.querySelectorAll('input').forEach(el=>el.addEventListener('input',render));document.getElementById('language').addEventListener('click',()=>{lang=lang==='ru'?'en':'ru';render()});window.WREH={compute,render};render();
</script></body></html>
