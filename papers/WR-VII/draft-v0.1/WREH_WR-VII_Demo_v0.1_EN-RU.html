<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WR-VII · Energy–Time Frontiers / Энергетико-временные рубежи</title>
<style>
:root{color-scheme:light;--ink:#203b50;--muted:#526d7c;--blue:#176581;--line:#cad9df;--paper:#f5f8fa;--amber:#995b10}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:1160px;margin:auto;padding:26px}header{border-bottom:1px solid var(--line);padding-bottom:22px;margin-bottom:24px;display:flex;align-items:start;justify-content:space-between;gap:16px}.eyebrow{font-size:13px;letter-spacing:.11em;color:var(--blue);font-weight:700}h1{font-size:clamp(25px,4vw,39px);line-height:1.12;margin:9px 0 14px;max-width:780px}h2{font-size:20px;margin:0 0 17px}p{margin:8px 0 16px}.intro{max-width:800px;color:var(--muted)}button,select,input{font:inherit}button{border:1px solid var(--line);border-radius:7px;padding:9px 13px;cursor:pointer;background:white;color:var(--ink)}button:hover,button:focus-visible{border-color:var(--blue);outline:2px solid #b3d6e4}#lang{white-space:nowrap}.grid{display:grid;grid-template-columns:320px 1fr;gap:22px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:23px}.controls label{display:block;font-size:14px;color:var(--muted);margin-top:19px}.control-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px}input[type=range]{width:100%;accent-color:var(--blue);margin-top:10px}select{max-width:100%;width:100%;margin-top:7px;padding:8px;background:white;border:1px solid var(--line);border-radius:6px}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:20px}.presets button{font-size:13px;padding:7px 9px}.status{font-size:19px;font-weight:700;margin:0 0 8px}.status.bad{color:var(--amber)}.formula{font-family:Georgia,serif;font-size:21px;margin:14px 0}.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.metric{padding:12px;background:#f0f5f7;border-radius:8px}.metric small{display:block;color:var(--muted);font-size:12px;line-height:1.35}.metric strong{display:block;font-size:19px;font-weight:600;margin-top:6px}svg{width:100%;height:auto;display:block}#plot{margin:18px 0}.caption{font-size:13px;color:var(--muted)}.candidate{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}.candidate code{font:14px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.note{border-left:3px solid var(--blue);padding-left:15px;color:var(--muted)}.footer{font-size:13px;color:var(--muted);margin-top:25px;border-top:1px solid var(--line);padding-top:18px}.disabled{opacity:.6}.probe{font-size:14px;background:#f0f5f7;border-radius:8px;padding:12px;margin-top:16px}.hidden{display:none}@media(max-width:780px){main{padding:18px}.grid{grid-template-columns:1fr}.controls{padding:18px}.candidate{grid-template-columns:1fr}.metric-grid{grid-template-columns:1fr 1fr}header{flex-direction:column}h1{font-size:29px}.card{padding:18px}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s}}
</style></head><body><main>
<header><div><div class="eyebrow">WREH · WR-VII v0.1</div><h1 data-i="title"></h1><p class="intro" data-i="intro"></p></div><button id="lang" aria-label="Switch language">English</button></header>
<div class="grid"><section class="card controls"><h2 data-i="controls"></h2>

<label for="time"><span class="control-title"><span data-i="time"></span><b id="timeValue"></b></span></label><input id="time" type="range" min="0" max="600" step="any" value="16.666666666666668">

<label for="position"><span class="control-title"><span data-i="position"></span><b id="positionValue"></b></span></label><input id="position" type="range" min="0" max="1" step=".001" value="0.5">

<div id="candidate"><div class="candidate"><div><h2 data-i="axis"></h2><code id="axis"></code><p class="caption">H = (d/2)(nₓσₓ + nᵧσᵧ + n_zσ_z)</p></div><div><h2 data-i="response"></h2><code id="prediction"></code><p class="caption" data-i="predictionCaption"></p></div></div><div class="probe"><b data-i="probes"></b><div id="probes"></div></div></div>

</main><script>
'use strict';
const dict={ru:{title:'Энергетико-временные рубежи реализуемости миров',intro:'Калиброванный пример с кубитом: достижимость отклика, полный класс постоянных генераторов и дополнительные протоколы различения.',controls:'Ресурсы и выбранный генератор',energy:'Граница E/h',time:'Длительность τ',target:'Целевая вероятность',frontier:'На рубеж',revival:'Два окна',transfer:'Полный перенос',window:'Допустимое окно фазы',position:'Положение внутри окна',beta:'Азимут β',latitude:'Знак продольной компоненты',minimum:'Нижний рубеж τ',budget:'Бюджет C/π',count:'Число окон',plotCaption:'Синие участки — допустимые фазы. Янтарная линия — ресурсный бюджет C. Круг — выбранный кандидат. При больших бюджетах показаны первые 2,5 периода.',axis:'Ось и диаметр',response:'Предсказанный отклик',predictionCaption:'Это расчёт выбранного кандидата, а не новые измеренные данные.',probes:'Предсказания отдельных подготовок',scopeTitle:'Паспорт модели',scope:'Замкнутая чистая унитарная эволюция. Постоянный бесследовый гамильтониан кубита. Подготовка |0⟩, конечный проектор |1⟩⟨1|, фиксированные лабораторные оси. E — жёсткая граница спектрального диаметра в джоулях. Частота E/h дана в МГц, время — в наносекундах. Доступен свободный выбор оси; аппаратные ограничения могут уменьшить достижимое множество.',sampling:'Вероятность здесь точная. Конечные повторения и погрешность калибровки в статье дают отдельный сертификат с гарантией покрытия; они не моделируются этими ползунками. Время подготовки, считывания и повторений не включено в τ.',claim:'Операционная граница этого носителя не является максимальной энергией реальности, временем жизни Вселенной или выбором единственного полного мира.',footer:'Математическая редакция v0.1 · REVIEWABLE_DRAFT · DOI WR-VII не присвоен · Внешнего рецензирования нет.',feasible:'Отклик достижим',empty:'Совместимый класс пуст',emptyText:'В рамках заданного носителя бюджет недостаточен для этой вероятности. Нарушение отвергает сочетание модели и калибровок.',frontierText:'Точный нижний рубеж достигнут. Диаметр d = E, но азимут генератора остаётся свободным.',interiorText:'Доступен непустой класс генераторов. Изменение β и допустимой фазы сохраняет целевой отклик.',circle:'Даже на рубеже остаётся окружность гамильтонианов. Дополнительные средние Паули являются отдельными измерениями, а не выводом из p.',full:'При p = 1 полная конечная матрица плотности одинакова для всех азимутов. На рубеже средние x,y при τ/2 различают генератор; это отдельные подготовки.',final:'При τ',half:'При τ/2',noCandidate:'Сначала увеличьте бюджет.'},en:{title:'Energy–Time Frontiers of World Realizability',intro:'A calibrated qubit benchmark: response feasibility, the full constant-generator class, and additional distinguishing protocols.',controls:'Resources and candidate generator',energy:'Cap E/h',time:'Duration τ',target:'Target probability',frontier:'At frontier',revival:'Two windows',transfer:'Complete transfer',window:'Allowed phase window',position:'Position within window',beta:'Azimuth β',latitude:'Longitudinal-component sign',minimum:'Lower duration frontier',budget:'Budget C/π',count:'Number of windows',plotCaption:'Blue segments are allowed phases. The amber line is the budget C. The circle marks a candidate. Large budgets display the first 2.5 periods.',axis:'Axis and diameter',response:'Predicted response',predictionCaption:'A calculation for the selected candidate, not new measured data.',probes:'Predictions for separate preparations',scopeTitle:'Model record',scope:'Closed pure unitary evolution. A constant traceless qubit Hamiltonian. Preparation |0⟩, final |1⟩⟨1| projector, fixed laboratory axes. E is a hard spectral-diameter cap in joules. E/h is in MHz; duration is in nanoseconds. Axes are freely available; hardware restrictions can reduce the reachable set.',sampling:'The probability here is exact. Finite repetitions and calibration error yield a separate confidence-qualified certificate in the article; these sliders do not simulate it. Preparation, readout and repetitions are excluded from τ.',claim:'An operational boundary of this carrier is not a maximum energy of reality, a lifetime of the Universe, or selection of a unique complete world.',footer:'Mathematical draft v0.1 · REVIEWABLE_DRAFT · No WR-VII DOI · Not externally peer reviewed.',feasible:'Response is reachable',empty:'Compatible class is empty',emptyText:'Within the declared carrier this budget cannot produce the target probability. Failure rejects the model-and-calibration combination.',frontierText:'The exact lower frontier is attained. Diameter d = E, but the generator azimuth remains free.',interiorText:'A nonempty generator class is available. Varying β and an allowed phase preserves the target response.',circle:'Even at the frontier a circle of Hamiltonians remains. Additional Pauli means require separate measurements; they are not inferred from p.',full:'At p = 1 every azimuth has the same complete final density operator. At the frontier, x,y means at τ/2 distinguish the generator on separate preparations.',final:'At τ',half:'At τ/2',noCandidate:'Increase the budget first.'}};
let language='ru';const $=id=>document.getElementById(id);const fmt=(x,n=4)=>Number(x).toFixed(n).replace(/\.?0+$/,'');
function calculate(){const nu=+$('energy').value,tau=+$('time').value,p=+$('target').value,theta=Math.asin(Math.sqrt(p)),C=Math.PI*nu*tau/1000;
const windows=[];for(let m=0;m*Math.PI+theta<=C+1e-12;m++)windows.push([m*Math.PI+theta,Math.min((m+1)*Math.PI-theta,Math.max(C,m*Math.PI+theta))]);
return{nu,tau,p,theta,C,windows,tmin:1000*theta/(Math.PI*nu)};}
function paint(){const d=dict[language];document.documentElement.lang=language;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=d[el.dataset.i]);$('lang').textContent=language==='ru'?'English':'Русский';$('sign').options[0].text='+ n_z';$('sign').options[1].text='− n_z';
const s=calculate();$('energyValue').textContent=fmt(s.nu,1)+' MHz';$('timeValue').textContent=fmt(s.tau,4)+' ns';$('minimum').textContent=fmt(s.tmin,4)+' ns';$('budget').textContent=fmt(s.C/Math.PI,4);$('count').textContent=s.windows.length;$('positionValue').textContent=fmt(+$('position').value,3);$('betaValue').textContent=$('beta').value+'°';
const old=+$('window').value||0;$('window').replaceChildren();s.windows.forEach((w,i)=>{const option=document.createElement('option');option.value=i;option.textContent=`${i+1}: [${fmt(w[0]/Math.PI)}, ${fmt(w[1]/Math.PI)}] π`;$('window').append(option)});$('window').value=Math.min(old,s.windows.length-1);
const feasible=s.windows.length>0,frontier=Math.abs(s.C-s.theta)<1e-10;$('status').textContent=feasible?d.feasible:d.empty;$('status').className='status'+(feasible?'':' bad');$('interpretation').textContent=feasible?(frontier?d.frontierText:d.interiorText):d.emptyText;$('candidate').classList.toggle('hidden',!feasible);$('ambiguity').textContent=!feasible?d.noCandidate:(s.p===1?d.full:d.circle);['window','position','beta','sign'].forEach(id=>$(id).disabled=!feasible);
let phi=null,n=null,bloch=null,half=null,gap=null;if(feasible){const w=s.windows[+$('window').value],zsign=+$('sign').value;phi=w[0]+(w[1]-w[0])*(+$('position').value);const radial=Math.min(1,Math.sqrt(s.p)/Math.abs(Math.sin(phi))),beta=+$('beta').value*Math.PI/180;n=[radial*Math.cos(beta),radial*Math.sin(beta),zsign*Math.sqrt(Math.max(0,1-radial*radial))];gap=1000*phi/(Math.PI*s.tau);
const rAt=a=>[n[1]*Math.sin(2*a)+n[0]*n[2]*(1-Math.cos(2*a)),-n[0]*Math.sin(2*a)+n[1]*n[2]*(1-Math.cos(2*a)),Math.cos(2*a)+n[2]*n[2]*(1-Math.cos(2*a))];bloch=rAt(phi);half=rAt(phi/2);$('axis').textContent=`n = (${n.map(x=>fmt(x,5)).join(', ')}) · d/h = ${fmt(gap,5)} MHz`;$('prediction').textContent=`p = ${fmt((1-n[2]*n[2])*Math.sin(phi)**2,7)} · φ/π = ${fmt(phi/Math.PI,5)}`;$('probes').textContent=`${d.final}: r = (${bloch.map(x=>fmt(x,5)).join(', ')}) · ${d.half}: r = (${half.map(x=>fmt(x,5)).join(', ')})`;}
const svg=$('plot'),NS='http://www.w3.org/2000/svg';svg.replaceChildren();function add(tag,attrs,text){const node=document.createElementNS(NS,tag);Object.entries(attrs).forEach(([k,v])=>node.setAttribute(k,v));if(text!==undefined)node.textContent=text;svg.append(node);return node;}add('title',{id:'plotTitle'},d.plotCaption);const x=a=>46+600*a/(2.5*Math.PI),y=p=>195-155*p;
for(let i=0;i<=5;i++){let a=i*Math.PI/2;add('line',{x1:x(a),x2:x(a),y1:30,y2:198,stroke:'#e2e9ed'});add('text',{x:x(a),y:220,'text-anchor':'middle','font-size':13,fill:'#526d7c'},fmt(i/2,1)+'π');}s.windows.forEach(w=>{if(w[0]>2.5*Math.PI)return;add('rect',{x:x(w[0]),y:30,width:Math.max(2,x(Math.min(w[1],2.5*Math.PI))-x(w[0])),height:165,fill:'#176581',opacity:.15});});const points=[];for(let i=0;i<=500;i++){const a=2.5*Math.PI*i/500;points.push(`${x(a)},${y(Math.sin(a)**2)}`)}add('polyline',{points:points.join(' '),fill:'none',stroke:'#385768','stroke-width':2});add('line',{x1:46,x2:646,y1:y(s.p),y2:y(s.p),stroke:'#176581','stroke-dasharray':'5 5'});if(s.C<=2.5*Math.PI)add('line',{x1:x(s.C),x2:x(s.C),y1:23,y2:198,stroke:'#995b10','stroke-width':2});if(phi!==null&&phi<=2.5*Math.PI)add('circle',{cx:x(phi),cy:y(Math.sin(phi)**2),r:5,fill:'#176581',stroke:'white','stroke-width':2});add('text',{x:9,y:40,'font-size':14,fill:'#526d7c'},'p');add('text',{x:653,y:21,'font-size':14,fill:'#526d7c'},'φ');
window.demoState={...s,feasible,frontier,phi,n,bloch,half,gap,language};}
['energy','time','target','window','position','beta','sign'].forEach(id=>$(id).addEventListener('input',paint));$('lang').addEventListener('click',()=>{language=language==='ru'?'en':'ru';paint()});$('frontier').addEventListener('click',()=>{$('time').value=1000*Math.asin(Math.sqrt(+$('target').value))/(Math.PI*+$('energy').value);paint()});$('revival').addEventListener('click',()=>{$('target').value='0.25';$('energy').value=10;$('time').value=125;paint()});$('transfer').addEventListener('click',()=>{$('target').value='1';$('energy').value=10;$('time').value=50;paint()});paint();
</script></body></html>
