<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WR-VI v0.2 — Aquarium Bounds</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef3f7;color:#19384d;font:17px/1.55 system-ui,sans-serif}main{max-width:1120px;margin:auto;padding:28px 24px}header{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}h1{font-size:36px;line-height:1.2;margin:12px 0 24px}h2{font-size:23px;margin:0 0 18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #cfdee8;border-radius:12px;padding:22px;margin-bottom:18px}button{font:inherit;color:inherit;border:1px solid #9aafbf;border-radius:5px;padding:6px 12px;background:white;cursor:pointer}button:hover{background:#eaf3f8}button:focus-visible,input:focus-visible{outline:3px solid #df8a23;outline-offset:3px}input[type=range]{width:100%;accent-color:#246a8a}label{display:block;margin:12px 0 2px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.notice{border-left:4px solid #246a8a;background:#eff6fa;padding:12px}.number{font-variant-numeric:tabular-nums;font-weight:700}svg{width:100%;height:auto;display:block}.mono{font:14px/1.7 ui-monospace,monospace;overflow-wrap:anywhere}.matrix{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0}.matrix span{background:#eef4f8;text-align:center;padding:8px;font-variant-numeric:tabular-nums}footer{font-size:13px;color:#596f7f}p{margin:12px 0}.small{font-size:14px}.out{margin:12px 0}#empty{color:#9b4016}@media(max-width:720px){main{padding:18px 14px}.grid{grid-template-columns:1fr}h1{font-size:28px}.card{padding:18px}header button{flex-shrink:0}svg text{font-size:22px}}
</style></head><body><main>
<header><div><strong>WREH · WR-VI v0.2</strong><h1 data-i="title"></h1></div><button id="language" type="button">English</button></header>
<p data-i="intro"></p><div class="grid"><section class="card"><h2 data-i="bounds"></h2>
<label for="cap"><span data-i="cap"></span> <output id="capValue" class="number"></output></label><input id="cap" type="range" min="0" max="600" value="150">
<div class="buttons"><button type="button" data-cap="90">ν = 0.15</button><button type="button" data-cap="100">ν = 1/6</button><button type="button" data-cap="150">ν = 1/4</button><button type="button" data-cap="400">ν = 2/3</button><button type="button" id="quantifierPreset">N = [1/6, 1/4]</button></div>
<label for="delta"><span data-i="delta"></span> <output id="deltaValue" class="number"></output></label><input id="delta" type="range" min="0" max="60" value="0">
<p class="mono" id="capInterval"></p><label><input id="irreducible" type="checkbox"> <span data-i="irred"></span></label>
<p class="notice" data-i="fixed"></p><p class="small" data-i="activity"></p>
</section><section class="card"><h2 data-i="classes"></h2>
<svg id="plot" viewBox="0 0 500 220" role="img" aria-labelledby="plotTitle"><title id="plotTitle"></title>
<line x1="45" x2="455" y1="55" y2="55" stroke="#a9bac5" stroke-width="10"/><text x="45" y="30" font-size="15">−1/12</text><text x="415" y="30" font-size="15">1/6</text>
<text x="45" y="82" font-size="14" id="allLabel"></text><line id="allLine" x1="45" x2="455" y1="100" y2="100" stroke="#235e87" stroke-width="10"/><circle id="allLeft" cx="45" cy="100" r="5" stroke="#235e87" fill="#235e87" stroke-width="2"/>
<text x="45" y="138" font-size="14" id="someLabel"></text><line id="someLine" x1="45" x2="455" y1="156" y2="156" stroke="#28858b" stroke-width="10"/><circle id="someLeft" cx="45" cy="156" r="5" stroke="#28858b" fill="#28858b" stroke-width="2"/>
<circle id="candidatePoint" cx="250" cy="156" r="7" fill="#ed9a2f" stroke="#815613"/><text x="45" y="203" font-size="14">t ∈ [−1/12, 1/6]</text></svg>
<div id="classText" class="out" aria-live="polite"></div><p class="small" data-i="legend"></p><p class="notice" data-i="warning"></p><p data-i="numeric"></p>
</section></div>
<div class="grid"><section class="card"><h2 data-i="candidate"></h2><div id="empty"></div>
<label for="position"><span data-i="position"></span></label><input id="position" type="range" min="0" max="1000" value="500">
<p class="mono" id="parameters"></p><div class="matrix" id="matrix"></div><p class="mono" id="responses"></p><p data-i="choice"></p>
</section><section class="card"><h2 data-i="reading"></h2><p data-i="threshold"></p><p data-i="strict"></p><p data-i="tolerance"></p><p data-i="physical"></p></section></div>
<footer data-i="footer"></footer></main>
<script>
'use strict';
const words={ru:{title:'Что ограничение добавляет к данным?',intro:'Для трёх подготовленных входов зафиксированы средние q = (1/4, 1/2, 3/4). Детальный баланс всё ещё оставляет интервал матриц. Жёсткая граница активности ν ограничивает его дополнительно.',bounds:'Заданные ограничения',cap:'Граница активности ν =',delta:'Полуширина интервала ρ =',irred:'Дополнительно требовать неприводимость',fixed:'Данные фиксированы. Параметры ν и ρ заданы отдельно; они не выводятся из средних откликов.',activity:'Активность α = вероятность смены метки за один шаг при равномерном входе. Это не энергия, энтропия или скорость в секунду.',classes:'Два разных квантора',all:'Для всех границ: C∀',some:'Хотя бы для одной: C∃',legend:'Серый отрезок: исходный класс. Синий: допустимость для каждой границы. Бирюзовый: допустимость хотя бы для одной. Пустой кружок означает исключённый левый конец.',warning:'При одной неизвестной фактической границе вывод о матрице использует C∃. Единственность C∀ сама по себе не означает единственности такого вывода.',numeric:'Пример §6: N = [1/6, 1/4]. Без неприводимости C∀ содержит P*, а C∃ имеет t ∈ [−1/12, −1/24], длина 1/24. Кнопка примера задаёт центр ν = 5/24 и полуширину ρ = 1/24; δ = 1/12 в статье обозначает полную ширину.',candidate:'Кандидат из возможного класса',position:'Выбрать положение в C∃',choice:'Оранжевая точка — выбранный для показа кандидат. Этот выбор не является дополнительным измерением.',reading:'Как читать результат',threshold:'При точных откликах без требования неприводимости: ν < 1/6 — пусто; ν = 1/6 — одна матрица; ν > 1/6 — класс. При ν ≥ 2/3 вся исходная неоднозначность сохраняется.',strict:'Пороговая матрица изолирует состояние 1. Требование неприводимости исключает её: инфимум активности 1/6 не достигается.',tolerance:'Положительный допуск ε разрушает точную одноэлементность. При ε = 0.01 и ν = 1/6 матрицы P(0,b,0), b ∈ [0.24,0.25], уже дают семейство свидетелей; это не весь класс с допуском.',physical:'Непустота или пустота этого конечного класса относится к заявленной модели. Физическое обоснование границы активности и детального баланса требует отдельной проверки.',footer:'REVIEWABLE_DRAFT · Статус внешнего рецензирования не подтверждён · DOI WR-VI не присвоен · Текст CC BY 4.0, код MIT · Автономный файл без внешних запросов.',empty:'пусто',one:'одна матрица',many:'неоднозначный класс',nocandidate:'Возможный класс пуст: допустимого кандидата нет.',plot:'Интервалы достраиваний при разных границах активности'},en:{title:'What does a constraint add to the data?',intro:'All three prepared inputs give the fixed mean responses q = (1/4, 1/2, 3/4). Detailed balance still leaves an interval of matrices. An activity cap ν restricts it further.',bounds:'Declared constraints',cap:'Activity cap ν =',delta:'Interval half-width ρ =',irred:'Additionally require irreducibility',fixed:'Data are fixed. Parameters ν and ρ are supplied separately; the mean responses do not infer them.',activity:'Activity α = probability of a label change in one step under a uniform input law. It is not energy, entropy or a rate per second.',classes:'Two different quantifiers',all:'Every cap: C∀',some:'At least one cap: C∃',legend:'Grey: original class. Blue: admissibility for every cap. Teal: admissibility for at least one cap. An open circle excludes the left endpoint.',warning:'For one unknown actual cap, inference about the matrix uses C∃. Uniqueness of C∀ alone does not establish uniqueness of that inference.',numeric:'Section 6 example: N = [1/6, 1/4]. Without irreducibility, C∀ contains P*, while C∃ has t ∈ [−1/12, −1/24], length 1/24. The preset sets centre ν = 5/24 and half-width ρ = 1/24; δ = 1/12 in the paper is the full width.',candidate:'Candidate from the possible class',position:'Choose a position in C∃',choice:'The orange point is a chosen display candidate. Choosing it is not an additional measurement.',reading:'How to read the result',threshold:'With exact responses and no irreducibility requirement: ν < 1/6 — empty; ν = 1/6 — one matrix; ν > 1/6 — a class. At ν ≥ 2/3 the entire original ambiguity remains.',strict:'The threshold matrix isolates state 1. Irreducibility excludes it: the activity infimum 1/6 is not attained.',tolerance:'Positive tolerance ε defeats the exact singleton. At ε = 0.01 and ν = 1/6, matrices P(0,b,0), b ∈ [0.24,0.25], already give a witness family; this is not the whole tolerance class.',physical:'Emptiness or nonemptiness of this finite class concerns the declared model. Physical justification of the activity cap and detailed balance needs separate evidence.',footer:'REVIEWABLE_DRAFT · External peer-review status unverified · No WR-VI DOI · Content CC BY 4.0, code MIT · Standalone file; no external requests.',empty:'empty',one:'one matrix',many:'nonunique class',nocandidate:'The possible class is empty: no feasible candidate.',plot:'Completion intervals under different activity caps'}};
let lang='ru'; const $=id=>document.getElementById(id); const low=-1/12,high=1/6;
const fmt=x=>(Math.abs(x)<1e-12?0:x).toFixed(4);
function interval(cap,strict){const upper=Math.min(high,cap/2-1/6);const empty=upper<low-1e-12||(strict&&upper<=low+1e-12);return {lower:low,upper,empty,kind:empty?'empty':Math.abs(upper-low)<1e-12?'one':'many'};}
function map(t){return 45+410*(t-low)/(high-low);}
function draw(key,data,strict){$(key+'Line').style.display=data.empty?'none':'';$(key+'Left').style.display=data.empty?'none':'';if(!data.empty){$(key+'Line').setAttribute('x2',map(data.upper));$(key+'Left').setAttribute('fill',strict?'white':(key==='all'?'#235e87':'#28858b'));}}
function update(){const w=words[lang];document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(el=>el.textContent=w[el.dataset.i]);$('language').textContent=lang==='ru'?'English':'Русский';$('plotTitle').textContent=w.plot;const cap=+$('cap').value/600,delta=+$('delta').value/600,strict=$('irreducible').checked;const minus=Math.max(0,cap-delta),plus=cap+delta;const all=interval(minus,strict),some=interval(plus,strict);$('capValue').textContent=fmt(cap);$('deltaValue').textContent=fmt(delta);$('capInterval').textContent='N = [max(0, ν − ρ), ν + ρ] = ['+fmt(minus)+', '+fmt(plus)+']';$('allLabel').textContent=w.all;$('someLabel').textContent=w.some;draw('all',all,strict);draw('some',some,strict);$('classText').textContent=w.all+': '+w[all.kind]+'. '+w.some+': '+w[some.kind]+'.';$('empty').textContent=some.empty?w.nocandidate:'';$('position').disabled=some.empty;$('candidatePoint').style.display=some.empty?'none':'';if(some.empty){$('matrix').replaceChildren();$('parameters').textContent='';$('responses').textContent='';return;}let u=+$('position').value/1000;if(strict&&u===0)u=0.001;const t=low+u*(some.upper-low),a=1/6+2*t,b=1/6-t,c=a;const p=[[1-a-b,a,b],[a,1-a-c,c],[b,c,1-b-c]];$('candidatePoint').setAttribute('cx',map(t));$('parameters').textContent='t = '+fmt(t)+'; (a,b,c) = ('+[a,b,c].map(fmt).join(', ')+')';$('matrix').replaceChildren(...p.flat().map(v=>{const el=document.createElement('span');el.textContent=fmt(v);return el;}));$('responses').textContent='q = ('+p.map(row=>fmt(row[1]/2+row[2])).join(', ')+'); α = '+fmt(2*(a+b+c)/3);}
$('language').addEventListener('click',()=>{lang=lang==='ru'?'en':'ru';update();});document.querySelectorAll('input').forEach(el=>el.addEventListener('input',update));document.querySelectorAll('[data-cap]').forEach(el=>el.addEventListener('click',()=>{$('cap').value=el.dataset.cap;update();}));
$('quantifierPreset').addEventListener('click',()=>{$('cap').value=125;$('delta').value=25;$('irreducible').checked=false;$('position').value=1000;update();});
window.WRVI={interval,update,getState:()=>({lang,cap:+$('cap').value/600,delta:+$('delta').value/600,irreducible:$('irreducible').checked})}; update();
</script></body></html>
